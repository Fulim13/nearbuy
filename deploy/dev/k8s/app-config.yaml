apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_ADDR: "redis:6379"
  LOG_LEVEL: "info"
  DEV_ECHO_SMS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
stringData:
  POSTGRES_USER:  "postgres"
  POSTGRES_PASSWORD: "postgres"
