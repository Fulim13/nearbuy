apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-service
  template:
    metadata:
      labels:
        app: shop-service
    spec:
      containers:
        - name: shop-service
          image: nearbuy/shop-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          env:
            - name: GRPC_PORT
              value: "9001"
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            # shop-service owns the cache for its own table, so it needs Redis.
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef: { name: app-config, key: REDIS_ADDR }
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_HOST }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/shop_db?sslmode=disable"
          readinessProbe:
            grpc: { port: 9001 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc: { port: 9001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
