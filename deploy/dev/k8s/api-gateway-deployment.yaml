apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: "api-gateway"
          image: nearbuy/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef: {name: app-config, key: REDIS_ADDR}
            - name: USER_SERVICE_ADDR
              value: "user-service:9000"
            - name: DEV_ECHO_SMS
              valueFrom:
                configMapKeyRef: { name: app-config, key: DEV_ECHO_SMS }
          readinessProbe:
            httpGet: { path: "/healthz", port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/healthz", port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
