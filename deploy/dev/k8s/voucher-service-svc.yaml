apiVersion: v1
kind: Service
metadata:
  name: voucher-service
spec:
  # Headless, same as user-service: DNS returns every pod IP so the gRPC
  # dns:/// resolver can round-robin across replicas.
  clusterIP: None
  ports:
    - name: grpc
      port: 9000
      targetPort: 9000
    # DTM reaches the Saga branches here. Same Service, second port: the branches
    # are part of this service, not a separate deployable.
    - name: branch
      port: 8000
      targetPort: 8000
  selector:
    app: voucher-service
