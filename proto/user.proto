syntax = "proto3";

package user.v1;

option go_package = "github.com/Fulim13/nearbuy/gen/golang/v1/user;user";

service User {
	rpc GetUser (GetUserRequest) returns (GetUserResponse);
	rpc GetOrCreateUserByPhone (GetOrCreateUserByPhoneRequest) returns (GetOrCreateUserByPhoneResponse);
}

message PublicUser {
	int64 id = 1;
	string nick_name = 2;
	string icon = 3;
}

message GetUserRequest {
	int64 id = 1;
}

message GetUserResponse {
	PublicUser user = 1;
}

message GetOrCreateUserByPhoneRequest {
	string phone = 1;
	string default_nick_name = 2;
}

message GetOrCreateUserByPhoneResponse {
	PublicUser user = 1;
	bool created = 2;
}
