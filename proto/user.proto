syntax = "proto3";

package user.v1;

option go_package = "github.com/Fulim13/nearbuy/gen/golang/v1/user;user";

service User {
	rpc GetUser (GetUserRequest) returns (GetUserResponse);
	rpc GetOrCreateUserByPhone (GetOrCreateUserByPhoneRequest) returns (GetOrCreateUserByPhoneResponse);

	rpc Follow(FollowRequest) returns (FollowResponse);
	rpc Unfollow(FollowRequest) returns (FollowResponse);
	rpc IsFollowing(FollowRequest) returns (IsFollowingResponse);
	rpc CommonFollowing(CommonFollowingRequest) returns (CommonFollowingResponse);
	rpc FollowCounts(FollowCountsRequest) returns (FollowCountsResponse);
}

message PublicUser {
	int64 id = 1;
	string nick_name = 2;
	string icon = 3;
}

message GetUserRequest {
	int64 id = 1;
}

message GetUserResponse {
	PublicUser user = 1;
}

message GetOrCreateUserByPhoneRequest {
	string phone = 1;
	string default_nick_name = 2;
}

message GetOrCreateUserByPhoneResponse {
	PublicUser user = 1;
	bool created = 2;
	// "user" or "admin". Here and not on PublicUser: only the login path needs
	// it, and PublicUser is served to anyone.
	string role = 3;
}

// Follow and Unfollow share a message: both are (actor, target) and nothing else.
message FollowRequest {
	int64 user_id   = 1;  // the actor, from x-user-id
	int64 target_id = 2;
}
message FollowResponse {}

message IsFollowingResponse {
	bool following = 1;
}

message CommonFollowingRequest {
	int64 user_id  = 1;
	int64 other_id = 2;
}

message CommonFollowingResponse {
	repeated PublicUser users = 1;
}

message FollowCountsRequest  {
		int64 user_id = 1;
}

message FollowCountsResponse {
	int64 following = 1;  // how many this user follows
	int64 followers = 2;  // how many follow this user
}
